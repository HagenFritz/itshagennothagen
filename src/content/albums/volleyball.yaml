title: Volleyball Wins
tagline: >-
  One hat per beach volleyball tournament win. Worn until the win, then retired
  forever.
intro:
  - >-
    This album documents my beach volleyball wins. Each hat represents a single
    tournament/league win. The majority of these hats are the ones I wore to win
    and once I have won a tournament with that hat, I retire it (usually).
  - >-
    The idea is borrowed from <a href="https://larahogan.me/donuts/"
    target="_blank" rel="noreferrer" class="text-primary underline
    underline-offset-2">Lara Hogan's donut manifesto</a>: if you don't
    deliberately mark the wins, you blow right past them on the way to the next
    one.
