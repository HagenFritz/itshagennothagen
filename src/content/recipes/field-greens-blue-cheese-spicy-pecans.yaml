title: Field Greens, Blue Cheese, and Spicy Pecans
tagline: >-
  A sweet-sharp vinaigrette over greens, apple, blue cheese, and candied pecans
  with a kick.
date: 2026-11-19
source: Family cookbook
serves: 8
intro:
  - >-
    The family copy of this recipe has the onion juice crossed out, so it stays
    out here too.
sections:
  - name: Spicy pecans
    ingredients:
      - 2 large egg whites
      - 1½ teaspoons salt
      - ¾ cup sugar
      - 2 teaspoons Worcestershire sauce
      - 2 tablespoons Hungarian paprika
      - 1½ teaspoons cayenne pepper
      - 24 ounces pecan halves
      - 6 tablespoons unsalted butter, melted and cooled
    steps:
      - Heat the oven to 325°F.
      - Whip the egg whites and salt until foamy.
      - Stir in the sugar, Worcestershire, paprika, and cayenne.
      - >-
        Fold in the pecans and the melted butter until every nut is coated, then
        spread them in a single layer on a baking sheet.
      - >-
        Bake 30 to 40 minutes, stirring every 10 minutes so they toast evenly.
      - Let them cool completely, then store airtight.
  - name: Vinaigrette
    ingredients:
      - ⅔ cup sugar
      - 1 teaspoon dry mustard
      - 1 teaspoon salt
      - ⅔ cup distilled white vinegar
      - 3 tablespoons apple cider vinegar
      - 2 tablespoons Worcestershire sauce
      - 1 cup vegetable oil
    steps:
      - >-
        Stir the sugar, dry mustard, salt, and both vinegars together until the
        sugar dissolves.
      - Whisk in the Worcestershire.
      - >-
        Drizzle in the oil slowly while whisking the whole time, until the
        dressing comes together.
  - name: Salad
    ingredients:
      - 24 ounces mixed field greens
      - 2 green onions, chopped
      - 4 ounces blue cheese, crumbled (about 1 cup)
      - 1 Granny Smith apple, cored and chopped
      - ¼ cup spicy pecans, coarsely chopped
    steps:
      - Combine the greens, green onions, and apple in a large bowl.
      - Pour on the vinaigrette and toss until everything is coated.
      - >-
        Serve the blue cheese and pecans on the side so everyone can add their
        own.
