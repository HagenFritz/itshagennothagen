title: Austin to Cinnamon Shore
miles: 242
tagline: >-
  An afternoon down the coastal bend to Mustang Island, second year running.
intro:
  - >-
    My wife and I drove from Austin down to Cinnamon Shore on a Tuesday
    afternoon in early September. We left around 1:30pm and pulled in a little
    before 7pm. Similar drive to what we did last year, but avoiding San Antonio
    in favor of some country roads.
  - >-
    This is the first road trip on the site: the small towns, the gas station
    finds, and the bridge over the bay.
stops:
  - title: Northwest Austin
    lat: 30.36435
    lon: -97.79232
    date: 2026-09-15
    blurb: >-
      Where the drive started, up in the hills off 360.
  - title: H-E-B on South Congress
    lat: 30.16883
    lon: -97.78709
    date: 2026-09-15
    blurb: >-
      First stop: the big HEB at South Congress to load up on goodies. Chips,
      dips, fruit, and pre-made meals rounded out the majority of the haul.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/heb1.jpg
        alt: >-
          H-E-B storefront under a grey sky, red canopy and big red letters over
          a glass wall, a green SUV parked in front and the Texas Backyard
          garden center to the side
      - src: ../../assets/roadtrips/cinnamon-shore/heb2.jpg
        alt: >-
          Modern H-E-B with a sweeping orange roofline and a green and yellow
          geometric entrance under a bright blue sky with puffy clouds
  - title: Kenedy
    lat: 28.82615
    lon: -97.84852
    via:
      - [30.04391, -97.69059]
    date: 2026-09-15
    blurb: >-
      The town of Kenedy. It grew up around the San Antonio and Aransas Pass
      Railway in 1886 on land that Mifflin Kenedy bought, and started life as
      Kenedy Junction. In the early 1900s, bar patrons on South First Street
      shot at passing trains often enough that the place picked up the nickname
      Six Shooter Junction.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6094.jpg
        alt: >-
          Wide small town main street with low brick storefronts, ornate street
          lamps, and a banner reading Kenedy on the corner building
        caption: The town of Kenedy as viewed through the windshield
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6092.jpg
        alt: >-
          Two lane highway seen through a windshield, dry grass and a fence on
          one side, a lone live oak on the horizon
        caption: The road into town.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6095.jpg
        alt: >-
          Weathered two story house with a clay tile roof and arched entry, half
          hidden by trees, beside a traffic signal and an empty street
        caption: >-
          A weathered house I liked. Seemed significant, but I could not find
          anything about it online.
  - title: Wind turbine
    lat: 28.15755
    lon: -97.76843
    date: 2026-09-15
    blurb: >-
      One turbine right up against the road with a whole field of them running
      off to the horizon behind and in front.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6096.jpg
        alt: >-
          White wind turbine towering over a dark plowed field, with dozens of
          smaller turbines lined up along the horizon under a clear blue sky
  - title: Mathis gas station
    lat: 28.11157
    lon: -97.81890
    date: 2026-09-15
    blurb: >-
      We stopped for snacks at the Speedy Express #38 gas station in Mathis. I
      was surprised to see the array of Pokémon card merch - nearly all the
      latest booster packs and more! They also had some rare, international
      treats/flavors so we had to stock up. I got some Coriander Doritos which
      were really good (and a bit spicy) while my wife got Kimbap-flavored Lays.
      They had other interesting candy and soda flavors including a
      ketchup-flavored soda.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6097.jpg
        alt: >-
          Pegboard wall hung with rows of Pokémon trading card booster packs and
          blister packs, orange price tags on each hook
        caption: >-
          Assorted Pokemon booster packs for $15-ish!
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6098.jpg
        alt: >-
          Hand holding a glass bottle of bright red Grandpa Joe's Ketchup Soda
          over a tile floor
        caption: Ketchup soda. Crazy flavor. Did not get it, but I should have.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6099.jpg
        alt: >-
          Cooler shelf of glass soda bottles, two red Kool-Aid Soda Tropical
          Punch bottles in front and orange ones behind
        caption: Kool-Aid soda. Never seen that before.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6100.jpg
        alt: >-
          Green bag of coriander flavor Doritos held over a car console with a
          green can and a Snyder's pretzel pieces bag in the cupholder
        caption: >-
          Coriander-flavored Doritos, lime Liquid Death, and honey mustard and
          onion pretzel pieces.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6101.jpg
        alt: >-
          Three story tan hotel with boarded and blanked out windows behind a
          fence, empty concrete lot in front
        caption: >-
          An old, abandoned hotel of some kind right next door. Looked kind of
          eerie.
  - title: JFK Causeway
    lat: 27.64682
    lon: -97.25156
    date: 2026-09-15
    blurb: >-
      The JFK Memorial Causeway carries Park Road 22 out of Flour Bluff and
      across the Laguna Madre to North Padre Island.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6102.jpg
        alt: >-
          View through a windshield of a divided causeway crossing open water,
          with the arch of the bridge ahead and a pickup truck in the next lane
        caption: Bridge view from the car.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6103.jpg
        alt: >-
          Flat hazy water of the Laguna Madre seen over a concrete barrier from
          the passenger window, low land on the far horizon
        caption: The Laguna Madre as we drive over.
  - title: The island road north
    lat: 27.62845
    lon: -97.20637
    date: 2026-09-15
    blurb: >-
      Heading up the island toward Cinnamon Shore. This is the scenery I
      remember most from last year's drive: flat and marshy with not much else.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6104.jpg
        alt: >-
          Straight two lane road running to a flat horizon, tall grass and power
          lines on the left, low dunes on the right
  - title: Cinnamon Shore
    lat: 27.77286
    lon: -97.10572
    date: 2026-09-15
    blurb: >-
      Pulled into Cinnamon Shore North on Mustang Island just before close at
      7:00 pm.
