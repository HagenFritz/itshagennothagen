title: Austin to Cinnamon Shore
miles: 229
tagline: >-
  An afternoon down the coastal bend to Mustang Island, second year running.
intro:
  - >-
    My wife and I drove from Austin down to Cinnamon Shore on a Monday
    afternoon, leaving around 2:30pm and pulling in a little before 7pm. We did
    this same drive last year, and it turns out the part I remember best is not
    the beach at the end of it. It is the flat, marshy stretch of island road
    right before you get there.
  - >-
    This is the first road trip I have put on the site. I have been wanting to
    keep track of these drives, so here is one: the small towns, the gas station
    finds, and the bridge over the bay.
stops:
  - title: Austin
    lat: 30.26720
    lon: -97.74310
    date: 2026-09-15
    blurb: >-
      Out of downtown mid afternoon. It is roughly a four hour run south through
      the coastal bend to the island.
  - title: Kenedy
    lat: 28.81944
    lon: -97.84797
    date: 2026-09-15
    blurb: >-
      I believe this is the town of Kenedy, so I looked it up afterward. It grew
      up around the San Antonio and Aransas Pass Railway in 1886 on land Mifflin
      Kenedy bought, and started life as Kenedy Junction. In the early 1900s,
      bar patrons on South First Street shot at passing trains often enough that
      the place picked up the nickname Six Shooter Junction.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6092.jpg
        alt: >-
          Two lane highway seen through a windshield, dry grass and a fence on
          one side, a lone live oak on the horizon
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6094.jpg
        alt: >-
          Wide small town main street with low brick storefronts, ornate street
          lamps, and a banner reading Kenedy on the corner building
        caption: I believe this is the town of Kenedy.
  - title: Old church house
    lat: 28.81806
    lon: -97.85183
    date: 2026-09-15
    blurb: >-
      A rundown house with a tile roof and an arched porch sitting behind
      overgrown trees at an intersection. I think it was converted into a church
      at some point, but I could not tell whether anyone still uses it, and I
      could not find anything about it online either.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6095.jpg
        alt: >-
          Weathered two story house with a clay tile roof and arched entry, half
          hidden by trees, beside a traffic signal and an empty street
  - title: Wind turbine
    lat: 28.15755
    lon: -97.76843
    date: 2026-09-15
    blurb: >-
      One turbine right up against the road with a whole field of them running
      off to the horizon behind it.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6096.jpg
        alt: >-
          White wind turbine towering over a dark plowed field, with dozens of
          smaller turbines lined up along the horizon under a clear blue sky
  - title: Mathis gas station
    lat: 28.11157
    lon: -97.81890
    date: 2026-09-15
    blurb: >-
      We stopped for snacks at a really cool gas station mart outside Mathis.
      There was a ton of Pokémon card merch and a cooler full of sodas I had
      never seen before.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6097.jpg
        alt: >-
          Pegboard wall hung with rows of Pokémon trading card booster packs and
          blister packs, orange price tags on each hook
        caption: >-
          They had all the booster packs for Pokémon cards, but they were all
          expensive.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6098.jpg
        alt: >-
          Hand holding a glass bottle of bright red Grandpa Joe's Ketchup Soda
          over a tile floor
        caption: Ketchup soda. Crazy flavor. Did not get it, but I should have.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6099.jpg
        alt: >-
          Cooler shelf of glass soda bottles, two red Kool-Aid Soda Tropical
          Punch bottles in front and orange ones behind
        caption: Kool-Aid soda. Never seen that before.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6100.jpg
        alt: >-
          Green bag of coriander flavor Doritos held over a car console with a
          green can and a Snyder's pretzel pieces bag in the cupholder
        caption: >-
          The haul: coriander flavored Doritos (super good), lime Liquid Death,
          and Snyder's honey mustard and onion pretzel pieces.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6101.jpg
        alt: >-
          Three story tan hotel with boarded and blanked out windows behind a
          fence, empty concrete lot in front
        caption: >-
          An old, abandoned hotel of some kind right next door. Looked kind of
          creepy and eerie.
  - title: JFK Causeway
    lat: 27.64682
    lon: -97.25156
    date: 2026-09-15
    blurb: >-
      The JFK Memorial Causeway carries Park Road 22 out of Flour Bluff and
      across the Laguna Madre to North Padre Island. The original 1950 span was
      the first post-tensioned segmental concrete bridge built in the United
      States.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6102.jpg
        alt: >-
          View through a windshield of a divided causeway crossing open water,
          with the arch of the bridge ahead and a pickup truck in the next lane
        caption: The bridge that takes us over to the island.
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6103.jpg
        alt: >-
          Flat hazy water of the Laguna Madre seen over a concrete barrier from
          the passenger window, low land on the far horizon
        caption: The Laguna Madre as we drive over.
  - title: The island road north
    lat: 27.62845
    lon: -97.20637
    date: 2026-09-15
    blurb: >-
      Heading up the island toward Cinnamon Shore. This is the scenery I
      remember most from last year's drive: flat and marshy, grass and power
      lines and not much else.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore/IMG_6104.jpg
        alt: >-
          Straight two lane road running to a flat horizon, tall grass and power
          lines on the left, low dunes on the right
  - title: Cinnamon Shore
    lat: 27.77286
    lon: -97.10572
    date: 2026-09-15
    blurb: >-
      Pulled into Cinnamon Shore North on Mustang Island around 6:45pm, roughly
      four hours after leaving Austin.
