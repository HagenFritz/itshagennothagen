title: Cinnamon Shore to Austin
miles: 236
tagline: >-
  Back home from vacation: down the beach, across on the ferry, and up through
  Victoria.
intro:
  - >-
    The drive home from Cinnamon Shore on a Saturday. We left around 10:20am and
    pulled in a little after 4:30pm, opting for the ferry because how often do
    you get to ride a ferry?
stops:
  - title: Cinnamon Shore
    lat: 27.77286
    lon: -97.10572
    date: 2026-09-19
    blurb: >-
      Checked out of Cinnamon Shore right at 10am on Saturday. Checked out the
      boutique and then headed for a drive on the beach.
  - title: Mustang Island beach
    lat: 27.70484
    lon: -97.14941
    date: 2026-09-19
    blurb: >-
      We wanted one last view of the beach. We took the nearby public road to
      the beach and parked for about five minutes to dip our toes in. Then we
      drove south along the sand for a few miles (seemed like forever) before
      cutting back to the highway and heading north to Port Aransas.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/beach_1.jpg
        alt: >-
          Wide sandy beach crisscrossed with tire tracks seen through a car
          window, the Gulf glittering beyond under a sky full of puffy clouds
        caption: Tire tracks on the beach road.
      - src: ../../assets/roadtrips/cinnamon-shore-return/beach_2.jpg
        alt: >-
          Gulf surf rolling onto a flat sandy beach seen over the hood of a car,
          with big white clouds stacked up against a blue sky
        caption: Parked on the sand, facing the Gulf.
  - title: Port Aransas ferry
    lat: 27.84410
    lon: -97.07048
    date: 2026-09-19
    blurb: >-
      We left the island on the ferry instead of the causeway we came in on.
      Spent some time in the queue to let a giant oil tanker through (so cool).
      Then a few minutes across the ship channel to Aransas Pass. We were the
      last car on!
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/ferry_5.jpg
        alt: >-
          Ferry staging lanes marked off with orange cones, a produce delivery
          truck and a pickup ahead, construction cranes and flags on the left
        caption: Pulling into the ferry lanes.
      - src: ../../assets/roadtrips/cinnamon-shore-return/ferry_4.jpg
        alt: >-
          Stopped in a ferry queue behind a black pickup with a ladder rack,
          orange barrels and a crane ahead under heavy clouds
        caption: The wait.
      - src: ../../assets/roadtrips/cinnamon-shore-return/ferry_3.jpg
        alt: >-
          View through a windshield from the deck of a car ferry, two black
          pickups parked ahead and the white pilothouse rising above them
        caption: On board.
      - src: ../../assets/roadtrips/cinnamon-shore-return/ferry_2.jpg
        alt: >-
          Ferry pilothouse with purple trim against a deep blue sky, seen over
          the ladder rack of the pickup parked in front
      - src: ../../assets/roadtrips/cinnamon-shore-return/ferry_1.jpg
        alt: >-
          Wide view from the ferry deck of the pilothouse and twin exhaust
          stacks, with the red hull of a large ship passing behind the pickups
        caption: The oil tanker sliding by in the channel.
  - title: Coasters
    lat: 27.91110
    lon: -97.13409
    date: 2026-09-19
    blurb: >-
      We got brunch at Coasters in Aransas Pass. Small restaurant with a great
      atmosphere right next to a marina. We got to watch a giant forklift raise
      a boat and store it away like a crate. I got the waffle tacos which were
      giant and really tasty.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/coasters_1.jpg
        alt: >-
          Two waffle tacos on a white plate, one stuffed with fried chicken and
          candied bacon, the other with eggs, cheese, avocado, and pico, with
          cups of syrup and salsa between them
        caption: >-
          Waffle tacos: fried chicken and candied bacon and chorizo, eggs,
          cheese, avocado, and pico.
      - src: ../../assets/roadtrips/cinnamon-shore-return/coasters_2.jpg
        alt: >-
          Stack of waffles topped with peppery fried chicken and a pile of
          candied bacon, with cups of butter and syrup on the side
        caption: Chicken and waffles with a mountain of candied bacon.
  - title: Copano Bay Causeway
    lat: 28.12617
    lon: -97.01550
    via:
      - [28.00349, -97.06727]
      - [28.03764, -97.04247]
    date: 2026-09-19
    blurb: >-
      North through Rockport and Fulton, then over Copano Bay on Highway 35.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/bridge.jpg
        alt: >-
          Green bay water beyond a low concrete bridge railing seen from a
          moving car, a thin strip of shoreline on the horizon under puffy
          clouds
        caption: Copano Bay from the causeway.
  - title: The Texan
    lat: 28.85789
    lon: -97.02752
    via:
      - [28.44671, -96.88904]
    date: 2026-09-19
    blurb: >-
      A quick pit stop at The Texan in Victoria for gas and snacks. It was our
      first time at the Texan which we had seen multiple times on our trek.
      Seemed like a smaller Buc-ee's, but they had an amazing selection of hot
      food. Unfortunately didn't get any since I was full from brunch still.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/texan.jpg
        alt: >-
          Limestone convenience store with an arched entrance and a sign reading
          The Texan over a cartoon cowboy on the shape of Texas
      - src: ../../assets/roadtrips/cinnamon-shore-return/texan_snacks.jpg
        alt: >-
          Hand holding an orange can of La Colombe pumpkin spice latte in a car,
          with a Zebra Cake and a Cosmic Brownie on the seat behind it
        caption: Pumpkin spice latte, a Zebra Cake, and a Cosmic Brownie.
  - title: Cuero
    lat: 29.09200
    lon: -97.28925
    date: 2026-09-19
    blurb: >-
      A quick loop through downtown Cuero to look at the DeWitt County
      Courthouse, all red sandstone trim and a clock tower. The town seemed
      somewhat obsessed with turkeys - there was mention of them everywhere. I
      did some digging: Farmers used to drive their birds on foot to market
      every fall, and in 1912 the town made a show of it: the first Turkey Trot
      sent more than 20,000 turkeys through town. It lives on as Turkeyfest,
      headlined by a live turkey race called the Great Gobbler Gallop.
    images:
      - src: ../../assets/roadtrips/cinnamon-shore-return/cuero_city_hall.jpg
        alt: >-
          Three story stone courthouse with red sandstone arches, corner towers,
          and a tall central clock tower, flags flying out front under a deep
          blue sky
        caption: The DeWitt County Courthouse.
      - src: ../../assets/roadtrips/cinnamon-shore-return/cuero_1.jpg
        alt: >-
          Empty small town street lined with low brick storefronts and utility
          poles under a bright sky full of clouds
        caption: Downtown Cuero, quiet on a Saturday afternoon.
  - title: Northwest Austin
    lat: 30.36435
    lon: -97.79232
    via:
      - [29.50013, -97.45626]
      - [29.88426, -97.67019]
      - [30.21081, -97.68318]
      - [30.21547, -97.73567]
      - [30.29139, -97.82820]
    date: 2026-09-19
    blurb: >-
      Up 183 through Gonzales, Luling, and Lockhart, and home a little after
      4:30pm.
