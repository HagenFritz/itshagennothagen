name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Astro check
        run: npm run check

      - name: Typecheck packages
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Prose lint
        run: npm run lint:prose

      - name: Build
        run: npm run build

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2
        with:
          path: src/content
          skip: ./node_modules,./dist,./package-lock.json
          ignore_words_list: brunch
